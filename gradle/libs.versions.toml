[versions]
axon = "5.4.2"
axoniq = "5.4.2"
axon-server-image = "axoniq/axonserver:2026.1.8@sha256:57b6ad30353cc0df1612d6a30be03a1df85b4b49b5f2feee218a70d1cb7794c2"
gradle-node = "7.1.0"
junit = "6.1.3"
kotlin = "2.4.21"
spring-boot = "4.2.0"

[libraries]
axon-bom = { module = "org.axonframework:axon-framework-bom", version.ref = "axon" }
axoniq-bom = { module = "io.axoniq.framework:axoniq-framework-bom", version.ref = "axoniq" }
axoniq-starter = { module = "io.axoniq.framework:axoniq-spring-boot-starter" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
reactor-core = { module = "io.projectreactor:reactor-core" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
testcontainers = { module = "org.testcontainers:testcontainers" }

[plugins]
gradle-node = { id = "com.github.node-gradle.node", version.ref = "gradle-node" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
