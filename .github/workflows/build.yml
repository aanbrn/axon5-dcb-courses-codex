name: Build and style

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCKER_HOST: tcp://127.0.0.1:1
      MISE_ENABLE_TOOLS: ruff,taplo

    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Eclipse Temurin
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install the style tools from mise.toml
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install_args: ruff taplo
          cache: false

      - name: Report effective tool versions
        run: |
          uname -sm
          java -version
          ./gradlew --console=plain --version
          mise --version
          mise exec ruff taplo -- ruff --version
          mise exec ruff taplo -- taplo --version

      - name: Check tracked formatting and style
        run: mise exec ruff taplo -- ./gradlew --console=plain styleCheck

      - name: Build and test from clean outputs
        run: ./gradlew --console=plain clean build --no-build-cache
